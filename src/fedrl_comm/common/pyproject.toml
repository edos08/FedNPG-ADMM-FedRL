[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedrl-common"
version = "0.1.0"
description = "Shared infra for FedNPG-ADMM project: env wrappers, policy net, rollout collection, comm-channel abstraction, results schema"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "torch==2.11.0",
    "gymnasium[mujoco]>=1.0.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]
