[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedrl-quantization"
version = "0.1.0"
description = "Quantization of FedNPG-ADMM agent-to-server transmissions: stochastic and reduced-precision float schemes, with bit-width sweeps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "torch==2.11.0",
    "fedrl-common>=0.1.0",
    "fedrl-fednpg-admm>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
fedrl-quantize-sweep = "quantization.sweep:main"

[tool.setuptools.packages.find]
where = ["src"]
