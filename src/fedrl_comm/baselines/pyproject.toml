[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedrl-baselines"
version = "0.1.0"
description = "Baseline FedRL algorithms for comparison against FedNPG-ADMM: standard-average FedNPG (O(d^2)) and FedPPO"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "torch==2.4.1",
    "fedrl-common>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
fedrl-train-baseline = "baselines.train:main"

[tool.setuptools.packages.find]
where = ["src"]
